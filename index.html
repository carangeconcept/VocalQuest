<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vocal Quest – Pitch RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout idea: a calm lesson path. One clear next step at a time, every note owns a colour, the RPG lives in the corners. */
:root{
  color-scheme:light;
  --bg:#f3f6f4; --card:#ffffff; --ink:#1d2532; --mute:#6c7686; --line:#e1e7ec;
  --brand:#14a37f; --brand-d:#0d7c60; --sun:#ffb81f; --sun-d:#d8930b; --coral:#ef5d5d; --coral-d:#c94343; --sky:#3d8fe6; --sky-d:#2a6fb8;
  --display:"Fredoka","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:700 16px/1.4 var(--body);overscroll-behavior:none;overflow-x:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:-1}#fx{z-index:60}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3,.disp{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
.hidden{display:none!important}
.tiny{font-size:13.5px;color:var(--mute);font-weight:700}
.c{text-align:center}
#app{max-width:540px;margin:0 auto;padding:10px 16px 104px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes popin{0%{opacity:0;transform:scale(.7)}70%{transform:scale(1.06)}100%{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(20,163,127,.45)}100%{box-shadow:0 0 0 18px rgba(20,163,127,0)}}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.in{animation:rise .38s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
.card{background:var(--card);border-radius:20px;box-shadow:0 1px 0 var(--line),0 6px 18px rgba(29,37,50,.06);padding:16px}

/* HUD */
#hud{position:sticky;top:6px;z-index:4;margin-bottom:14px}
.hud{display:flex;gap:10px;align-items:center;padding:8px 14px 8px 6px}
.hud canvas{width:60px;height:60px;flex:none}
.hinfo{flex:1;min-width:0}
.ttl{font-family:var(--display);font-weight:600;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xprow{display:flex;gap:8px;align-items:center;margin-top:3px}
.lv{background:var(--brand);color:#fff;border-radius:8px;padding:0 7px;font-weight:900;font-size:12.5px;white-space:nowrap}
.bar{flex:1;height:10px;border-radius:6px;background:#e8edf1;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--brand),#3fd1a7);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.purse{display:flex;flex-direction:column;gap:2px;align-items:flex-end;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.purse .g{color:var(--sun-d)}.purse .f{color:var(--coral)}

/* Buttons */
.btn{flex:1;min-height:52px;padding:10px 16px;border:0;border-radius:16px;background:#fff;color:var(--ink);font-weight:900;letter-spacing:.02em;box-shadow:0 0 0 2px var(--line) inset,0 4px 0 var(--line);transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 2px var(--line) inset,0 1px 0 var(--line)}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 4px 0 var(--brand-d)}
.btn.primary:active:not(:disabled){box-shadow:0 1px 0 var(--brand-d)}
.btn.gold{background:var(--sun);color:#3d2a00;box-shadow:0 4px 0 var(--sun-d)}
.btn.bad{background:var(--coral);color:#fff;box-shadow:0 4px 0 var(--coral-d)}
.btn.blue{background:var(--sky);color:#fff;box-shadow:0 4px 0 var(--sky-d)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:40px;flex:none;padding:6px 14px;border-radius:12px;font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.row.sp{justify-content:space-between}
.link{background:none;border:0;color:var(--mute);width:100%;padding:12px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;border-radius:999px;padding:8px 14px;min-height:40px;font-weight:800;font-size:14px;background:#fff;box-shadow:0 0 0 2px var(--line) inset}
.chip.on{background:var(--brand);color:#fff;box-shadow:none}
.sec{margin:22px 2px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec h3{font-size:20px}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:540px;display:flex;z-index:5;background:#fff;border-top:2px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;position:relative;background:none;border:0;border-radius:14px;min-height:54px;font-weight:900;font-size:12px;color:var(--mute)}
.tabs button span{display:block;font-size:22px;line-height:1.1;transition:transform .2s}
.tabs button.on{color:var(--brand);background:#e7f6f1}
.tabs button.on span{transform:scale(1.15)}
.dot{position:absolute;top:6px;right:24%;width:10px;height:10px;border-radius:50%;background:var(--coral);border:2px solid #fff}

/* Learn path */
.unit{border-radius:20px;padding:14px 16px;color:#fff;background:var(--uc);box-shadow:0 4px 0 color-mix(in srgb,var(--uc) 70%,#000);display:flex;gap:12px;align-items:center}
.unit b{font-family:var(--display);font-weight:600;font-size:20px;display:block}
.unit .tiny{color:rgba(255,255,255,.88)}
.unit.lock{background:#c8d0d8;box-shadow:0 4px 0 #aab3bc}
.unit .num{font:600 13px var(--display);background:rgba(255,255,255,.22);border-radius:8px;padding:2px 8px;white-space:nowrap}
.path{position:relative;margin:8px 0 18px}
.node{position:absolute;width:74px;height:70px;margin-left:-37px;border:0;border-radius:50%;background:var(--uc);color:#fff;box-shadow:0 6px 0 color-mix(in srgb,var(--uc) 70%,#000);font:600 26px var(--display);display:grid;place-items:center;padding:0;animation:popin .4s both;animation-delay:calc(var(--i)*35ms);transition:transform .06s,box-shadow .06s}
.node:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 color-mix(in srgb,var(--uc) 70%,#000)}
.node.locked{background:#dde3e8;color:#9aa4ae;box-shadow:0 6px 0 #c4ccd3;cursor:not-allowed}
.node.boss{width:90px;height:86px;margin-left:-45px;font-size:44px}
.node.chord{border-radius:22px;font-size:17px;line-height:1.05}
.node.cur{animation:popin .4s both,pulse 1.6s 0.5s infinite}
.node .stars{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:13px;letter-spacing:1px;color:var(--sun);white-space:nowrap;text-shadow:0 1px 0 #fff}
.node .stars s{text-decoration:none;color:#d3d9df}
.bubble{position:absolute;top:-38px;left:50%;transform:translateX(-50%);background:#fff;color:var(--brand);border-radius:12px;padding:4px 12px;font:600 15px var(--display);box-shadow:0 0 0 2px var(--line) inset,0 3px 0 var(--line);white-space:nowrap;animation:bob 1.4s ease-in-out infinite}
.bubble::after{content:"";position:absolute;bottom:-6px;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}

/* Practice */
.game{display:flex;gap:14px;align-items:center;width:100%;text-align:left;margin-bottom:12px;border:0;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 0 0 2px var(--line) inset,0 4px 0 var(--line);transition:transform .06s,box-shadow .06s}
.game:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 2px var(--line) inset,0 1px 0 var(--line)}
.game .ge{font-size:36px;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--gc) 16%,#fff);flex:none}
.game b{font-family:var(--display);font-weight:600;font-size:18px;display:block}
.game .best{margin-left:auto;text-align:right;font-weight:900;color:var(--sun-d);white-space:nowrap;font-size:13px}
.game:disabled{opacity:.6;cursor:not-allowed}

/* Hero & shop */
.wispbox{display:flex;flex-direction:column;align-items:center;text-align:center}
.wispbox canvas{width:170px;height:170px}
.stat{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:2px solid var(--line)}
.stat:last-child{border:0}
.stat .st{background:#eef2f5;border-radius:8px;font-weight:900;font-size:12px;padding:3px 0;width:44px;text-align:center}
.stat .sv{font:600 22px var(--display);color:var(--brand);min-width:30px;text-align:right}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot,.cell{aspect-ratio:1;border:0;border-radius:16px;background:#fff;box-shadow:0 0 0 3px var(--rc,var(--line)) inset;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;padding:2px}
.slot small{font-size:11px;color:var(--mute);font-weight:800}
.bag{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.cell{font-size:22px;border-radius:12px}
.cell.empty{box-shadow:0 0 0 2px var(--line) inset;background:none}
.item{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:16px;background:#fff;box-shadow:0 0 0 3px var(--rc) inset;margin:10px 0}
.item .ie{font-size:34px}
.item b{color:var(--rc)}
.dq{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:2px solid var(--line)}
.dq:last-child{border:0}
.dq .bar{height:8px;margin-top:5px}
.dq .bar i{background:var(--sun)}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.shop .card{text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.shop .big{font-size:42px;animation:bob 2.6s ease-in-out infinite}

/* Overlays and sheets */
.overlay{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.st-top{display:flex;gap:10px;align-items:center;padding:10px 12px}
.st-top b{flex:1;font:600 19px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xbtn{width:42px;height:42px;border:0;border-radius:12px;background:#fff;box-shadow:0 0 0 2px var(--line) inset;font-size:18px;font-weight:900;color:var(--mute);flex:none}
#stage{background:#1b2346;color:#fff}
#stage .st-top b{color:#fff}
#stage .xbtn,#stage .pill{background:rgba(255,255,255,.12);box-shadow:none;color:#fff}
.pill{border:0;border-radius:12px;padding:8px 12px;font-weight:900;min-height:42px;background:#fff;box-shadow:0 0 0 2px var(--line) inset}
.st-mid{flex:1;min-height:0;position:relative}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.st-bot{min-height:46px;padding:10px 14px 14px;text-align:center;font-weight:800;color:#d9def5}
#parry{position:absolute;left:0;right:0;bottom:70px;padding:0 16px;display:flex;flex-direction:column;gap:10px;animation:popin .2s both}
.pr-t{font:600 24px var(--display);text-align:center;color:var(--sun)}
.pr-bar{height:10px;border-radius:5px;background:rgba(255,255,255,.15);overflow:hidden}
.pr-bar i{display:block;height:100%;width:100%;background:var(--sun);border-radius:5px}
.scrim{position:fixed;inset:0;z-index:30;background:rgba(29,37,50,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:540px;background:#fff;border-radius:26px 26px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));max-height:92%;overflow:auto;animation:up .3s cubic-bezier(.2,.9,.3,1.05)}
.sheet.center{border-radius:26px;margin:auto 16px;animation:popin .3s both}
@keyframes up{from{transform:translateY(60%)}}
.foe-show{width:120px;height:120px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-size:66px;background:color-mix(in srgb,var(--zc) 18%,#fff)}
.foe-show span{animation:bob 1.6s ease-in-out infinite}
.res-t{text-align:center;font-size:28px}
.stars-big{font-size:46px;text-align:center;letter-spacing:8px;color:#dde3e8;line-height:1.25}
.stars-big .on{display:inline-block;color:var(--sun);animation:popin .45s cubic-bezier(.3,1.8,.5,1) both;animation-delay:calc(.3s + var(--i)*.25s)}
.lvlup{background:#fff6dd;color:#7a5200;font:600 17px var(--display);text-align:center;border-radius:14px;padding:8px;margin:10px 0;animation:popin .4s .5s both}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 2px;border-bottom:2px solid var(--line)}
.rewards{display:flex;gap:10px;justify-content:center;margin:14px 0}
.rw{font:600 18px var(--display);background:#e7f6f1;color:var(--brand-d);border-radius:12px;padding:4px 14px}
.rw.gold{background:#fff4d6;color:var(--sun-d)}
.tip{background:#eef5ff;color:#244c7a;border-radius:14px;padding:10px 12px;font-size:15px;margin:10px 0}
.chest{font-size:110px;text-align:center;background:none;border:0;width:100%;display:block;animation:shake .7s infinite}
#toast{opacity:0;position:fixed;left:50%;top:calc(90px + env(safe-area-inset-top));transform:translateX(-50%);z-index:70;background:var(--ink);color:#fff;border-radius:14px;padding:9px 16px;font-weight:800;pointer-events:none;width:max-content;max-width:88%;text-align:center}
#toast.show{animation:toast 2.6s both}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-14px)}8%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* Lesson player */
#lesson{z-index:21}
.ls-top{display:flex;gap:12px;align-items:center;padding:12px 16px 4px}
.ls-prog{flex:1;height:14px;border-radius:8px;background:#e1e7ec;overflow:hidden}
.ls-prog i{display:block;height:100%;border-radius:8px;background:var(--brand);transition:width .4s}
.ls-body{flex:1;overflow:auto;padding:16px 18px 10px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.ls-body>*{flex-shrink:0}
.ls-q{font:600 23px var(--display);margin:4px 0 0}
.ls-sub{color:var(--mute);font-size:15.5px;max-width:34ch;margin:0}
.badge{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;font:600 54px var(--display);color:#fff;background:var(--nc);box-shadow:0 6px 0 color-mix(in srgb,var(--nc) 70%,#000);animation:popin .4s both}
.badge.sm{width:78px;height:78px;font-size:34px;box-shadow:0 4px 0 color-mix(in srgb,var(--nc) 70%,#000)}
.badge.q{background:#dde3e8;color:#fff;box-shadow:0 6px 0 #c4ccd3}
.seqrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.seqrow span{min-width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font:600 22px var(--display);background:#fff;color:var(--ink);box-shadow:0 0 0 3px var(--nc) inset;transition:transform .15s}
.seqrow span.cur{transform:scale(1.15);background:var(--nc);color:#fff}
.seqrow span.ok{background:var(--nc);color:#fff;opacity:.55}
.kb{display:flex;gap:4px;justify-content:center;width:100%;max-width:440px}
.kb button{flex:1;min-width:0;height:92px;border:0;border-radius:0 0 12px 12px;background:#fff;box-shadow:0 0 0 2px var(--line) inset,0 4px 0 var(--line);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font:600 17px var(--display);color:var(--mute)}
.kb button.hl{background:var(--nc);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--nc) 70%,#000)}
.kb button.sel{background:var(--nc);color:#fff}
.kb button.bad{background:var(--coral);color:#fff;animation:shake .35s}
.kb button.miss{box-shadow:0 0 0 3px var(--brand) inset,0 4px 0 var(--line);color:var(--brand)}
.opts{display:grid;gap:12px;width:100%;max-width:420px}
.opts.n2{grid-template-columns:1fr 1fr}.opts.n3{grid-template-columns:1fr 1fr 1fr}.opts.n4{grid-template-columns:1fr 1fr}
.opt{min-height:72px;border:0;border-radius:18px;background:#fff;box-shadow:0 0 0 2px var(--line) inset,0 4px 0 var(--line);font:600 24px var(--display);color:var(--ink);border-bottom:0;position:relative;overflow:hidden}
.opt::before{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--nc,transparent)}
.opt.ok{background:#e3f7ef;box-shadow:0 0 0 3px var(--brand) inset}
.opt.no{background:#fde8e8;box-shadow:0 0 0 3px var(--coral) inset;animation:shake .35s}
.play{border:0;border-radius:18px;background:var(--sky);color:#fff;font-weight:900;padding:12px 20px;box-shadow:0 4px 0 var(--sky-d);display:inline-flex;gap:8px;align-items:center}
.play:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sky-d)}
.meter{width:100%;max-width:420px;height:210px;border-radius:20px;background:#fff;box-shadow:0 0 0 2px var(--line) inset;touch-action:none}
.holdbar{width:100%;max-width:420px;height:14px;border-radius:8px;background:#e1e7ec;overflow:hidden}
.holdbar i{display:block;height:100%;width:0;background:var(--brand);border-radius:8px}
.offbar{width:100%;max-width:420px;height:6px;border-radius:4px;background:#f3e3e3;overflow:hidden;margin-top:-6px}
.offbar i{display:block;height:100%;width:0;background:#ef5d5d;border-radius:4px;transition:width .1s}
.cue.bad{color:var(--coral-d,#c94040)}
.meter.shake{animation:shake .45s}
.cele{position:fixed;left:50%;top:38%;z-index:61;pointer-events:none;font:700 46px var(--display);color:#fff;white-space:nowrap;
  -webkit-text-stroke:2px rgba(0,0,0,.12);text-shadow:0 4px 0 #0c8a6a,0 10px 24px rgba(20,163,127,.5);animation:cele 1.3s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes cele{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-8deg)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(3deg)}
  32%{transform:translate(-50%,-50%) scale(1) rotate(0)}75%{opacity:1;transform:translate(-50%,-62%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(.9)}}
.cue{font:600 20px var(--display);min-height:28px}
.cue.ok{color:var(--brand)}.cue.up,.cue.down{color:var(--sky-d)}
.ls-foot{padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:2px solid var(--line);background:#fff;display:flex;flex-direction:column;gap:10px}
.ls-foot.ok{background:#e3f7ef;border-color:#c7ecdf}
.ls-foot.no{background:#fde8e8;border-color:#f6cccc}
.fb{font:600 20px var(--display);display:flex;gap:8px;align-items:center}
.ls-foot.ok .fb{color:var(--brand-d)}.ls-foot.no .fb{color:var(--coral-d)}
.fb small{font:700 15px var(--body);color:var(--ink)}
.lesson-end{display:flex;flex-direction:column;align-items:center;gap:10px}

/* Ear duels (quiz overlay) */
#quiz{z-index:21}
.q-lives{font-size:20px;letter-spacing:3px;color:var(--coral)}
.q-lives s{text-decoration:none;color:#d3d9df}
.q-body{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:14px 18px;text-align:center}
.q-score span{font:600 70px/1 var(--display);color:var(--brand);display:block}
.q-score small{font-weight:900;color:var(--mute);letter-spacing:.06em}
.q-plate{display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:#fff;border-radius:20px;box-shadow:0 0 0 2px var(--line) inset,0 4px 0 var(--line);padding:14px 26px;font-weight:900;font-size:13px;color:var(--sky-d)}
.eq{display:flex;gap:5px;align-items:flex-end;height:40px}
.eq i{width:8px;height:8px;border-radius:4px;background:var(--sky)}
.playing .eq i{animation:eq .42s ease-in-out infinite alternate;animation-delay:calc(var(--k)*-.13s)}
@keyframes eq{to{height:40px}}
.q-prompt{margin:0;font-size:18px;max-width:30ch}
.q-tell{min-height:26px;font:600 19px var(--display)}
.q-clock{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:6px}
.q-clock b{font:700 64px/1 var(--display);color:var(--brand);font-variant-numeric:tabular-nums;transition:color .2s}
.q-cbar{width:100%;height:14px;border-radius:8px;background:#e1e7ec;overflow:hidden}
.q-cbar i{display:block;height:100%;width:100%;background:var(--brand);border-radius:8px}
.q-clock.amber b{color:var(--sun-d)}.q-clock.amber i{background:var(--sun)}

/* ================= voice finder: talk or hum and the game picks your voice type ================= */
const VF = {on: false, ms: [], t0: 0};
function vfType(m) { let best = 'tenor'; for (const k in VOICES) if (Math.abs(VOICES[k].root - m) < Math.abs(VOICES[best].root - m)) best = k; return best; }
async function voiceFind(where) {
  if (input !== 'mic') { const ok = await enableMic(); if (!ok) { voiceFindUI(where, 'nomic'); return; } }
  VF.on = true; VF.ms = []; VF.t0 = performance.now() / 1000; VF.where = where; VF.voiced = 0; VF.lastV = 0; hist.length = 0; voiceFindUI(where, 'listen');
  // keep listening until you've talked for a while AND then gone quiet, so the whole sentence gets heard
  let last = VF.t0;
  const loop = () => { if (!VF.on) return; const now = performance.now() / 1000, dt = Math.min(0.1, now - last), v = sense(now); last = now;
    if (v.voiced && v.m > 30 && v.m < 84) { VF.ms.push(v.m); VF.voiced += dt; VF.lastV = now; }
    const e = $('#vfMeter'); if (e) e.style.width = Math.min(92, VF.voiced / VF_NEED * 92) + '%';
    const b = $('#vfDone'); if (b) b.disabled = VF.ms.length < 40;
    const finished = VF.voiced >= VF_NEED && now - VF.lastV > 1.6;   // a pause after enough talking = done
    if (finished || now - VF.t0 > 25) { vfStop(); return; } requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
const VF_NEED = 3;   // seconds of actual voice to collect before a pause can end it
function vfStop() { if (!VF.on) return; VF.on = false; const e = $('#vfMeter'); if (e) e.style.width = '100%'; setTimeout(voiceFindDone, 250); }
function voiceFindDone() {
  if (VF.ms.length < 40) { voiceFindUI(VF.where, 'quiet'); return; }
  const s2 = VF.ms.slice().sort((a, b) => a - b), med = s2[s2.length >> 1]; VF.pick = vfType(med); VF.med = med; voiceFindUI(VF.where, 'done');
}

function buildSteps(e) {
  const l = e.l, before = learnedBefore(e), N = NL;
  const near = (o, pool) => pool.filter(x => x !== o).sort((a, b) => Math.abs(a - o) - Math.abs(b - o));
  if (l.kind === 'note') {
    const n = l.n, k = near(n, before);
    if (!before.length) return [
      {t: 'intro', title: `This is ${N(n)}`, text: NOTE_TEXT[n], play: [n], kb: [n]},
      {t: 'sing', n, hold: 1.5},
      {t: 'same', ref: n, mys: n},
      {t: 'sing', n, hold: 2.5},
      {t: 'same', ref: n, mys: rnd([2, 7])},
      {t: 'sing', n, hold: 3, noShow: true}];
    return [
      {t: 'intro', title: `This is ${N(n)}`, text: NOTE_TEXT[n], play: [k[0], n], kb: [n]},
      {t: 'sing', n, hold: 1.5},
      {t: 'pick', mys: n, opts: shuffle([n, k[0]])},
      {t: 'seq', notes: [k[0], n]},
      {t: 'pick', mys: rnd([n, ...k.slice(0, 2)]), opts: shuffle([n, ...k.slice(0, Math.min(3, k.length))])},
      {t: 'sing', n, hold: 2.5},

  }

    return [
      {t: 'intro', title: l.title, text: l.text, play: l.notes, chord: true, kb: l.notes},
      {t: 'tap', target: l.notes, pool, q: `Tap the three notes of the ${l.name} chord`},
      {t: 'seq', notes: [a, b, c]},
      {t: 'pick', mys: rnd(l.notes), opts: l.notes.slice(), q: 'One note from the chord. Which one?'},
      {t: 'seq', notes: [c, b, a]},
      {t: 'chordq', mys: l.notes, opts: shuffle([l.notes, [a, b + 1 > 14 ? b - 1 : b + 1, c].map(x => x)]).map(x => x), q: `Which one is the ${l.name} chord?`}];
  }
  if (l.kind === 'scale') { const s = l.seq, down = s.slice().reverse();
    return [
      {t: 'intro', title: l.title, text: l.text, play: s, kb: s},
      {t: 'seq', notes: s},
      {t: 'seq', notes: down},
      (() => { const my = rnd(s.slice(1)); return {t: 'pick', mys: my, pre: 0, opts: shuffle([my, ...shuffle(s.filter(x => x !== my && x !== 0)).slice(0, 3)]), q: 'You hear C, then another note. Which one?'}; })(),
      {t: 'seq', notes: s}];
  }
  if (l.kind === 'chords3') { const q = () => { const ch = rnd(CHORDS3); return {t: 'chordq', mys: ch.notes, opts: CHORDS3.map(c => c.notes), labels: CHORDS3.map(c => c.name), q: 'Which chord is this?'}; };
    return [{t: 'intro', title: l.title, text: l.text, chords: CHORDS3}, q(), q(), {t: 'seq', notes: rnd(CHORDS3).notes}, q(), q()];
  }
  if (l.kind === 'leap') { const pr = () => { const p = rnd(l.pairs); return R() < 0.5 ? p : [p[1], p[0]]; }, p1 = l.pairs[0];
    const lq = () => { const p = rnd(l.pairs); return {t: 'pick', pre: p[0], mys: p[1], opts: shuffle([p[1], ...near(p[1], learned().filter(o => o !== p[0])).slice(0, 2)]), q: `You hear ${N(p[0])}, then a leap up. Where did it land?`}; };
    return [{t: 'intro', title: l.title, text: l.text, play: p1, kb: p1}, {t: 'seq', notes: p1}, {t: 'seq', notes: pr()}, lq(), {t: 'seq', notes: pr()}, lq(), {t: 'seq', notes: pr()}];
  }
