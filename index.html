<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vocal Quest – Pitch RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout idea: a night-sky sticker book. Chunky outlined "stickers" on a deep sky; every musical note owns a colour. */
:root{
  color-scheme:dark;
  --night:#0c1424; --card:#1c2a50; --card2:#2a3d80; --ol:#070b18;
  --ink:#fff8ec; --mute:#a9b7dc;
  --sun:#ffc93c; --coral:#ff6b5e; --mint:#3be0a1; --sky:#58c7ff; --grape:#c58bff;
  --display:"Lilita One","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--night);color:var(--ink);font:700 16px/1.35 var(--body);overscroll-behavior:none;overflow-x:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
body::before{content:"";position:fixed;inset:-20%;z-index:-2;pointer-events:none;
  background:radial-gradient(40% 30% at 20% 18%,#1f7f9b66,transparent 70%),radial-gradient(36% 30% at 85% 30%,#7b3fbf55,transparent 70%),radial-gradient(46% 34% at 45% 92%,#ff6b5e33,transparent 70%);
  animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,-3%) rotate(8deg) scale(1.12)}}
#bg,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bg{z-index:-1}#fx{z-index:60}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3,.disp{font-family:var(--display);font-weight:400;letter-spacing:.02em;margin:0;text-wrap:balance}
.hidden{display:none!important}
.tiny{font-size:12.5px;color:var(--mute);font-weight:700}
.c{text-align:center}
#app{max-width:560px;margin:0 auto;padding:10px 16px 110px}
.stk{background:var(--card);border:3px solid var(--ol);border-radius:20px;box-shadow:0 5px 0 var(--ol)}
@keyframes pop{from{opacity:.2;transform:translateY(16px) scale(.94)}60%{transform:translateY(-3px) scale(1.02)}to{opacity:1;transform:none}}
.in{animation:pop .45s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--i,0)*55ms)}

/* HUD */
#hud{position:sticky;top:6px;z-index:4;margin-bottom:14px}
.hud{display:flex;gap:10px;align-items:center;padding:8px 12px 8px 4px;background:linear-gradient(180deg,#24366f,var(--card))}
.hud canvas{width:72px;height:72px;flex:none}
.hinfo{flex:1;min-width:0}
.ttl{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xprow{display:flex;gap:8px;align-items:center;margin:3px 0}
.lv{background:var(--sun);color:#3a2500;border:2px solid var(--ol);border-radius:10px;padding:0 7px;font-weight:900;font-size:13px;white-space:nowrap}
.bar{flex:1;height:14px;border-radius:9px;background:var(--ol);border:2px solid var(--ol);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--mint),var(--sky));transition:width .9s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#fff8 50%,transparent 70%);animation:shine 2.4s infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.purse{display:flex;flex-direction:column;gap:4px;align-items:flex-end;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.purse span:first-child{color:var(--sun)}

/* Buttons */
.btn{flex:1;min-height:52px;padding:10px 16px;border-radius:16px;border:3px solid var(--ol);box-shadow:0 5px 0 var(--ol);background:var(--card2);font-weight:900;transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled),.pill:active,.chip:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ol)}
.btn.primary{background:var(--sun);color:#3a2500}
.btn.good{background:var(--mint);color:#04321f}
.btn.bad{background:var(--coral);color:#3d0a05}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:42px;flex:none;padding:6px 14px;border-radius:13px}
.row{display:flex;gap:10px;align-items:center}
.row.sp{justify-content:space-between}
.link{background:none;border:0;color:var(--mute);width:100%;padding:14px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip,.pill{border:3px solid var(--ol);box-shadow:0 4px 0 var(--ol);background:var(--card2);border-radius:999px;padding:7px 14px;min-height:42px;font-weight:800;transition:transform .06s,box-shadow .06s}
.chip.on{background:var(--mint);color:#04321f}
.sec{font-family:var(--display);font-size:20px;margin:20px 2px 10px;display:flex;justify-content:space-between;align-items:baseline}
.card{padding:14px;margin-bottom:14px}

/* Tabs */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(528px,calc(100% - 24px));display:flex;gap:4px;padding:6px;z-index:5;background:#16224a;border:3px solid var(--ol);border-radius:22px;box-shadow:0 5px 0 var(--ol)}
.tabs button{flex:1;position:relative;background:none;border:0;border-radius:15px;min-height:56px;font-size:12px;font-weight:900;color:var(--mute);transition:background .2s}
.tabs button span{display:block;font-size:24px;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.tabs button.on{background:var(--sun);color:#3a2500}
.tabs button.on span{transform:translateY(-4px) scale(1.2) rotate(-6deg)}
.dot{position:absolute;top:6px;right:22%;width:12px;height:12px;border-radius:50%;background:var(--coral);border:2px solid var(--ol);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.35)}}

/* Map */
.map{position:relative}
.map svg{position:absolute;left:0;top:0;pointer-events:none}
.p0{fill:none;stroke:#ffffff22;stroke-width:9;stroke-linecap:round;stroke-dasharray:1 18}
.p1{fill:none;stroke:var(--sun);stroke-width:9;stroke-linecap:round;stroke-dasharray:1 18;animation:march 1.2s linear infinite}
@keyframes march{to{stroke-dashoffset:-19}}
.zban{position:absolute;left:0;right:0;display:flex;gap:12px;align-items:center;padding:10px 14px;background:linear-gradient(90deg,color-mix(in srgb,var(--zc) 42%,var(--card)),var(--card));border:3px solid var(--ol);border-radius:18px;box-shadow:0 5px 0 var(--ol)}
.zban b{font-family:var(--display);font-weight:400;font-size:19px}
.zban .zi{font-size:34px;animation:bob 3s ease-in-out infinite}
.zban.lock{filter:saturate(.25);opacity:.8}
.node{position:absolute;width:78px;height:78px;margin:-39px 0 0 -39px;border-radius:50%;border:4px solid var(--ol);background:radial-gradient(circle at 35% 28%,#fff6,transparent 45%),var(--zc);box-shadow:0 7px 0 var(--ol);padding:0;animation:pop .5s both;animation-delay:calc(var(--i)*40ms);transition:transform .08s,box-shadow .08s}
.node:active:not(:disabled){transform:translateY(6px);box-shadow:0 1px 0 var(--ol)}
.node .ne{font-size:36px;display:block;line-height:1}
.node.boss{width:96px;height:96px;margin:-48px 0 0 -48px;border-color:#5c3b00;box-shadow:0 7px 0 #5c3b00,0 0 0 4px var(--sun)}
.node.boss .ne{font-size:46px}
.node.locked{background:#3a4566;cursor:not-allowed}
.node.locked .ne{font-size:26px;opacity:.7}
.node.cur::before{content:"";position:absolute;inset:-12px;border-radius:50%;border:4px solid var(--sun);animation:ring 1.4s ease-out infinite}
@keyframes ring{from{transform:scale(.8);opacity:1}to{transform:scale(1.35);opacity:0}}
.node.cur .ne{animation:bob 1.2s ease-in-out infinite}
.bubble{position:absolute;left:50%;top:-40px;transform:translateX(-50%);background:var(--ink);color:#1a1440;font-family:var(--display);font-size:15px;padding:3px 12px;border-radius:12px;border:3px solid var(--ol);white-space:nowrap;animation:hop 1s ease-in-out infinite}
@keyframes hop{50%{transform:translateX(-50%) translateY(-7px)}}
@keyframes bob{50%{transform:translateY(-6px)}}
.nstars{position:absolute;left:50%;bottom:-27px;transform:translateX(-50%);font-size:15px;letter-spacing:1px;white-space:nowrap;color:var(--sun);text-shadow:0 2px 0 var(--ol)}
.nstars s{text-decoration:none;color:#ffffff30}

/* Arcade */
.game{display:flex;gap:14px;align-items:center;padding:14px;margin-bottom:14px;width:100%;text-align:left;color:var(--ink);background:linear-gradient(120deg,color-mix(in srgb,var(--zc) 38%,var(--card)),var(--card) 70%);transition:transform .06s,box-shadow .06s}
.game:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ol)}
.game .ge{font-size:46px;width:64px;text-align:center;animation:bob 2.6s ease-in-out infinite;animation-delay:calc(var(--i)*-.5s)}
.game b{font-family:var(--display);font-weight:400;font-size:21px}
.game .best{margin-left:auto;text-align:right;font-weight:900;color:var(--sun);white-space:nowrap}

/* Hero */
.wispbox{display:flex;flex-direction:column;align-items:center;padding:6px 14px 14px;background:radial-gradient(circle at 50% 40%,#2f4aa0,var(--card) 70%)}
.wispbox canvas{width:180px;height:180px}
.stat{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:2px dashed #ffffff18}
.stat:last-child{border:0}
.stat .se{font-size:24px;width:32px;text-align:center}
.stat .sv{font-family:var(--display);font-size:22px;color:var(--sun);min-width:34px;text-align:right}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slot,.cell{aspect-ratio:1;border:3px solid var(--rc,var(--ol));border-radius:16px;background:#111a36;box-shadow:0 4px 0 var(--ol);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;padding:2px;position:relative}
.slot small{font-size:11px;color:var(--mute);font-weight:800}
.bag{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.cell{font-size:22px;border-radius:12px}
.cell.empty{border-style:dashed;border-color:#ffffff22;box-shadow:none;background:none}
.item{display:flex;gap:12px;align-items:center;padding:10px 12px;border:3px solid var(--rc);border-radius:16px;background:#111a36;box-shadow:0 0 18px color-mix(in srgb,var(--rc) 45%,transparent);margin:10px 0}
.item .ie{font-size:36px}
.item b{color:var(--rc)}

/* Town */
.dq{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:2px dashed #ffffff18}
.dq:last-child{border:0}
.dq .de{font-size:26px;width:34px;text-align:center}
.dq .bar{height:10px;margin-top:4px}
.dq .bar i{background:linear-gradient(90deg,var(--sun),var(--coral))}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.shop .stk{padding:12px;text-align:center}
.shop .big{font-size:46px;display:block;animation:bob 2.4s ease-in-out infinite}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:20;background:var(--night);display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.st-top{display:flex;gap:10px;align-items:center;padding:10px 12px}
.st-top b{flex:1;font-family:var(--display);font-weight:400;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-mid{flex:1;min-height:0;position:relative}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.st-bot{min-height:46px;padding:10px 14px 14px;text-align:center;font-weight:900}
.scrim{position:fixed;inset:0;z-index:30;background:#040814cc;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:560px;background:var(--card);border:3px solid var(--ol);border-bottom:0;border-radius:26px 26px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92%;overflow:auto;animation:up .32s cubic-bezier(.2,.9,.3,1.1)}
.sheet.center{border:3px solid var(--ol);border-radius:26px;margin:auto 14px;box-shadow:0 6px 0 var(--ol);animation:pop .35s both}
@keyframes up{from{transform:translateY(60%)}}
.foe-show{width:130px;height:130px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-size:74px;background:radial-gradient(circle,color-mix(in srgb,var(--zc) 60%,transparent),transparent 70%)}
.foe-show span{animation:bob 1.6s ease-in-out infinite}
.res-ico{font-size:70px;text-align:center;line-height:1.1}
.res-ico.win{animation:tada .9s both}
@keyframes tada{0%{transform:scale(.2) rotate(-20deg)}55%{transform:scale(1.25) rotate(8deg)}75%{transform:scale(.95) rotate(-4deg)}100%{transform:none}}
.res-t{text-align:center;font-size:28px}
.res-t small{font-size:14px;background:var(--sun);color:#3a2500;border-radius:8px;padding:1px 7px;vertical-align:middle}
.spell{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.spell span{background:var(--nc);color:#0a0f1e;border:3px solid var(--ol);border-radius:12px;padding:3px 10px;font-weight:900;box-shadow:0 3px 0 var(--ol);animation:pop .4s both;animation-delay:calc(var(--i)*45ms)}
.spell span.hl{transform:translateY(-8px) scale(1.2);transition:transform .1s}
.stars-big{font-size:50px;text-align:center;letter-spacing:8px;color:#ffffff22;line-height:1.2}
.stars-big .on{display:inline-block;color:var(--sun);text-shadow:0 4px 0 var(--ol);animation:star .5s cubic-bezier(.3,1.8,.5,1) both;animation-delay:calc(.35s + var(--i)*.28s)}
@keyframes star{from{transform:scale(0) rotate(-180deg)}}
.lvlup{background:linear-gradient(90deg,var(--sun),#ff9a5d);color:#2a1500;font-family:var(--display);font-size:18px;text-align:center;border:3px solid var(--ol);border-radius:14px;padding:8px;margin:10px 0;animation:tada .8s .5s both}
.kv{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:2px dashed #ffffff18}
.rewards{display:flex;gap:10px;justify-content:center;margin:12px 0}
.rw{font-family:var(--display);font-size:19px;background:#111a36;border:3px solid var(--ol);border-radius:14px;padding:4px 14px;color:var(--sky)}
.rw.gold{color:var(--sun)}
.tip{background:#3a2a10;border:3px solid #7a5a20;color:#ffe2a8;border-radius:14px;padding:10px 12px;font-size:14px;margin:10px 0}
.chest{font-size:110px;text-align:center;animation:rattle .7s infinite;background:none;border:0;width:100%;display:block}
@keyframes rattle{0%,100%{transform:rotate(0)}20%{transform:rotate(-7deg) scale(1.04)}40%{transform:rotate(7deg)}60%{transform:rotate(-4deg) scale(1.04)}80%{transform:rotate(4deg)}}
#toast{opacity:0;position:fixed;left:50%;top:calc(96px + env(safe-area-inset-top));transform:translateX(-50%);z-index:70;background:var(--ink);color:#1a1440;border:3px solid var(--ol);border-radius:14px;padding:8px 16px;font-weight:900;box-shadow:0 4px 0 var(--ol);pointer-events:none;max-width:86%;text-align:center}
#toast.show{animation:toast 2.6s both}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-20px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px)}}

/* Intro */
#intro{align-items:center;justify-content:center;text-align:center;padding:24px 20px;overflow:auto;background:radial-gradient(circle at 50% 30%,#22387a,var(--night) 70%)}
.logo{font-family:var(--display);font-size:clamp(44px,13vw,68px);line-height:.95;color:var(--sun);text-shadow:0 5px 0 var(--ol),0 0 30px #ffc93c55}
.logo span{display:inline-block;animation:wave 1.8s ease-in-out infinite;animation-delay:calc(var(--i)*90ms)}
@keyframes wave{50%{transform:translateY(-9px) rotate(-3deg)}}
#intro canvas{width:180px;height:180px}
#intro .box{max-width:420px;width:100%}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="app"><div id="hud"></div><div id="view"></div></div>
<nav class="tabs" id="tabs"></nav>

<div id="stage" class="overlay hidden">
  <div class="st-top"><button class="pill" data-a="pause" aria-label="Pause or leave">✕</button><b id="stTitle"></b><span id="stBtns"></span></div>
  <div class="st-mid"><canvas id="cv"></canvas></div>
  <div class="st-bot" id="stHint"></div>
</div>
<div id="intro" class="overlay hidden"></div>
<div id="scrim" class="scrim hidden"><div id="sheet" class="sheet"></div></div>
<div id="toast"></div>
<canvas id="fx"></canvas>

<script>
(() => {
'use strict';
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const R = Math.random, rnd = a => a[Math.floor(R() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const NOTE = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const pcOf = m => ((Math.round(m) % 12) + 12) % 12;
const pc = m => NOTE[pcOf(m)];
const noteName = m => pc(m) + (Math.floor(Math.round(m) / 12) - 1);
const hz2midi = f => 69 + 12 * Math.log2(f / 440);
const mf = m => 440 * Math.pow(2, (m - 69) / 12);
const fold = (m, ref) => m - 12 * Math.round((m - ref) / 12);
const hue = m => (pcOf(m) * 30 + 350) % 360;            // every pitch class owns a colour
const col = (m, l = 62, a = 1) => `hsla(${hue(m)},88%,${l}%,${a})`;
const dstr = d => d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
const today = () => dstr(new Date()), yday = () => dstr(new Date(Date.now() - 864e5));

/* ================= game data ================= */
const VOICES = {bass:{n:'Bass',root:40}, baritone:{n:'Baritone',root:45}, tenor:{n:'Tenor',root:48}, alto:{n:'Alto',root:53}, mezzo:{n:'Mezzo',root:57}, soprano:{n:'Soprano',root:60}};
const ZONES = [
  {name:'Whispering Meadow',icon:'🌼',c:'#3be0a1',unlock:1,tol:50,beat:1.6,atk:16,blurb:'Hold single notes steady',quests:[
    {id:'m1',name:'Grub',emoji:'🐛',pat:[0,4,0]},
    {id:'m2',name:'Mushroom Imp',emoji:'🍄',pat:[0,4,7,4,0]},
    {id:'m3',name:'Bog Toad',emoji:'🐸',pat:[0,2,4,2,0,-2,0],boss:true}]},
  {name:'Echo Caves',icon:'💎',c:'#58c7ff',unlock:2,tol:42,beat:1.4,atk:19,blurb:'Leap between notes',quests:[
    {id:'c1',name:'Cave Bat',emoji:'🦇',pat:[0,5,0,5,7,5,0]},
    {id:'c2',name:'Crystal Spider',emoji:'🕷️',pat:[0,3,7,3,0,7,5,0]},
    {id:'c3',name:'Stone Golem',emoji:'🗿',pat:[0,7,5,7,10,7,5,0,7,0],boss:true}]},
  {name:'Singing Forest',icon:'🌲',c:'#ffc93c',unlock:3,tol:36,beat:1.2,atk:22,blurb:'Climb and descend scales',quests:[
    {id:'f1',name:'Gloom Owl',emoji:'🦉',pat:[0,2,4,2,0]},
    {id:'f2',name:'Dire Wolf',emoji:'🐺',pat:[0,2,4,5,7,5,4,2,0]},
    {id:'f3',name:'Elder Treant',emoji:'🌳',pat:[0,2,4,5,7,9,11,9,7,5,4,2,0],boss:true}]},
  {name:'Crystal Citadel',icon:'🏰',c:'#c58bff',unlock:5,tol:28,beat:1.1,atk:25,blurb:'Arpeggios with tight tuning',quests:[
    {id:'k1',name:'Wraith',emoji:'👻',pat:[0,4,7,4,0,7,4,0]},
    {id:'k2',name:'Dark Sorcerer',emoji:'🧙',pat:[0,4,7,11,7,4,0,5,9,5,0]},
    {id:'k3',name:'Storm Dragon',emoji:'🐉',pat:[0,4,7,11,14,11,7,4,0,5,9,12,9,5,7,0],boss:true}]},
  {name:'Throne of the Hush',icon:'🌑',c:'#ff6b5e',unlock:7,tol:24,beat:1.0,atk:28,blurb:'Everything you have learned',quests:[
    {id:'h1',name:'Silence Knight',emoji:'🤺',pat:[0,7,12,7,4,0,5,9,12,9,5,0]},
    {id:'h2',name:'The Hush',emoji:'🌑',pat:[0,2,4,7,12,11,7,4,5,9,12,14,12,9,7,4,2,0],boss:true}]}
];
const QL = ZONES.flatMap((z, zi) => z.quests.map((q, qi) => ({z, zi, q, qi})));
const TITLES = ['Squeaky Novice','Shower Singer','Apprentice Bard','Tuned Adventurer','Songblade','Harmonist','Pitch Knight','Arch-Cantor','Resonance Sage','Legend of the Perfect Fifth'];
const STAGES = ['Spark','Wisp','Sprite','Phoenix'];
const STAT = {
  pow:{n:'Power',e:'⚔️',adj:'Roaring',d:'+6% spell damage each'},
  foc:{n:'Focus',e:'🎯',adj:'True',d:'+3¢ pitch forgiveness each'},
  vit:{n:'Vitality',e:'💗',adj:'Hearty',d:'+12 max HP each'},

    draw() {
      const b = this, T = b.T, cx = W / 2, base = H * 0.46, hu = b.anchor == null ? 40 : hue(b.anchor); sky(T, b.anchor == null ? '#ff6b5e' : col(b.anchor, 60));
      const sz = (b.anchor == null ? 22 + b.pre * 30 : 30 + Math.min(70, b.held * 4)) * (b.over ? Math.max(0, 1 - b.over) : 1), dev = Math.abs(b.d || 0);
      const gl = g.createRadialGradient(cx, base - sz, 5, cx, base - sz, sz * 3); gl.addColorStop(0, `hsla(${hu},95%,65%,.5)`); gl.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gl; g.fillRect(0, 0, W, H * 0.6);
      for (let L = 0; L < 3; L++) { const s = sz * (1 - L * 0.28), wob = Math.sin(T * (9 + L * 3)) * (3 + dev * 40) * (1 - L * 0.2);
        g.fillStyle = `hsl(${hu + L * 16},95%,${58 + L * 15}%)`; g.beginPath(); g.moveTo(cx - s * 0.55, base); g.quadraticCurveTo(cx - s * 0.75, base - s * 0.9, cx + wob, base - s * 2.1); g.quadraticCurveTo(cx + s * 0.75, base - s * 0.9, cx + s * 0.55, base); g.quadraticCurveTo(cx, base + s * 0.4, cx - s * 0.55, base); g.fill(); if (!L) { g.strokeStyle = '#070b18'; g.lineWidth = 4; g.stroke(); } }
      for (const a of [-0.25, 0.25]) { g.save(); g.translate(cx, base + 14); g.rotate(a); g.fillStyle = '#070b18'; rr(-50, -11, 100, 22, 11); g.fill(); g.fillStyle = '#8a5a34'; rr(-47, -8, 94, 16, 8); g.fill(); g.restore(); }
      txt(b.anchor == null ? 'Sing and hold' : b.held.toFixed(1) + 's', cx, 50, FONT(b.anchor == null ? 30 : 54, true), '#ffc93c', 'center', 7);
      if (b.anchor != null) txt(noteName(b.anchor), cx, 92, FONT(18), col(b.anchor, 72), 'center', 4);
      const yc = H * 0.78, px = Math.min(70, H * 0.12) / b.band;
      g.fillStyle = 'rgba(255,255,255,.06)'; rr(14, yc - b.band * px, W - 28, b.band * px * 2, 14); g.fill();
      g.fillStyle = `hsla(${hu},90%,60%,.22)`; g.fillRect(14, yc - 0.15 * px, W - 28, 0.3 * px);
      g.strokeStyle = 'rgba(255,255,255,.35)'; g.setLineDash([6, 6]); g.lineWidth = 2; g.beginPath(); g.moveTo(14, yc); g.lineTo(W - 14, yc); g.stroke(); g.setLineDash([]);
      g.lineWidth = 4; g.lineCap = 'round'; g.lineJoin = 'round';
      for (let i = 1; i < b.trace.length; i++) { const p = b.trace[i], q = b.trace[i - 1]; if (p.d == null || q.d == null) continue; g.strokeStyle = Math.abs(p.d) <= 0.15 ? '#3be0a1' : Math.abs(p.d) <= b.band ? '#ffc93c' : '#ff6b5e';
        g.beginPath(); g.moveTo(W * 0.82 - (T - q.t) * W * 0.17, yc - clamp(q.d, -b.band * 1.4, b.band * 1.4) * px); g.lineTo(W * 0.82 - (T - p.t) * W * 0.17, yc - clamp(p.d, -b.band * 1.4, b.band * 1.4) * px); g.stroke(); }
      if (b.anchor != null && !b.over) drawWisp(g, W * 0.82, yc - clamp(b.d, -b.band * 1.4, b.band * 1.4) * px, 12, {m: b.anchor, t: T, mouth: b.sil > 0.05 ? 0 : 1, stage: stage()});
      txt('sharp', 22, yc - b.band * px + 12, FONT(11), '#a9b7dc'); txt('flat', 22, yc + b.band * px - 12, FONT(11), '#a9b7dc');
      drawFx();
    }};
}
function finishFlame(b) {
  const sec = Math.round(b.held * 10) / 10, best = sec > S.best.flame; if (best) S.best.flame = sec; prog('flame', sec); const sb = touchDay();
  const st = b.held > 0 ? Math.round(b.steady / b.held * 100) : 0, rw = grant(5 + Math.round(sec * 3), Math.round(sec * 1.5) + sb); save(); closeStage();
  arcadeResult('flame', {win: best && sec >= 3, lose: false, icon: best && sec >= 3 ? '🏆' : '🔥', title: best && sec >= 3 ? 'New best!' : sec >= 8 ? 'Strong breath' : 'Flame out', rw, rows: [['Held for', sec.toFixed(1) + 's'], ['Rock-steady (within 15¢)', st + '%'], ['Your best', S.best.flame.toFixed(1) + 's']], tip: sec < 4 ? 'Breathe low into your belly and start the note gently. Quiet and steady beats loud.' : ''});
}

/* ================= Scrying Mirror (tuner) ================= */
function Mirror() {
  return {title: 'Scrying Mirror', lo: 36, hi: 84, padT: 0, padB: 0, m: null, rl: 999, rh: -999, free: true,
    init() { $('#stBtns').innerHTML = '<button class="pill" data-a="ref">🔊 Home</button>'; hint(input === 'demo' ? 'Touch and drag the field to make a note' : 'Sing or hum any note'); },
    step(dt, v) { this.m = v.voiced ? v.m : null; if (v.voiced) { const k = Math.round(v.m); this.rl = Math.min(this.rl, k); this.rh = Math.max(this.rh, k); } },
    draw() {
      const b = this, T = b.T, cx = W / 2, m = b.m; sky(T, m == null ? '#3be0a1' : col(m, 60));
      drawWisp(g, cx, H * 0.2, 38, {m, t: T, mouth: m == null ? 0 : 1, stage: stage()});
      const my = H * 0.66, mw = W - 56;
      g.fillStyle = '#070b18'; rr(25, my - 19, mw + 6, 44, 22); g.fill(); g.fillStyle = '#26315a'; rr(28, my - 16, mw, 32, 16); g.fill();
      g.fillStyle = 'rgba(59,224,161,.35)'; g.fillRect(cx - mw * 0.1, my - 16, mw * 0.2, 32); g.fillStyle = '#3be0a1'; g.fillRect(cx - 1.5, my - 16, 3, 32);
      if (m != null) { const k = Math.round(m), c = (m - k) * 100;
        txt(noteName(m), cx, H * 0.46, FONT(Math.min(110, W * 0.28), true), col(m, 68), 'center', 9);
        txt(Math.round(mf(m)) + ' Hz', cx, H * 0.46 + 66, FONT(15), '#a9b7dc', 'center');
        const nx = cx + clamp(c, -50, 50) / 50 * (mw / 2 - 14); g.fillStyle = '#070b18'; g.beginPath(); g.arc(nx, my, 15, 0, 7); g.fill(); g.fillStyle = Math.abs(c) < 10 ? '#3be0a1' : '#ffc93c'; g.beginPath(); g.arc(nx, my, 11, 0, 7); g.fill();
        txt((c > 0 ? '+' : '') + Math.round(c) + '¢ ' + (Math.abs(c) < 10 ? 'in tune' : c < 0 ? 'flat' : 'sharp'), cx, my + 44, FONT(17), '#fff8ec', 'center'); }
      else txt('–', cx, H * 0.46, FONT(90, true), '#ffffff40', 'center');
      txt('♭', 14, my, FONT(18), '#a9b7dc', 'center'); txt('♯', W - 14, my, FONT(18), '#a9b7dc', 'center');
      if (b.rh >= b.rl) txt('Range explored: ' + noteName(b.rl) + ' to ' + noteName(b.rh), cx, H - 26, FONT(14), '#a9b7dc', 'center');
    }};
}
const MAKE = {glide: Glide, echo: Echo, flame: Flame, mirror: Mirror};

/* ================= sheets ================= */
function openPrep(zi, qi) {
  cur = {zi, qi}; const z = ZONES[zi], q = z.quests[qi], notes = buildNotes(z, q);
  openSheet(`<div class="foe-show" style="--zc:${z.c}"><span>${q.emoji}</span></div><h2 class="res-t">${q.name}${q.boss ? ' <small>BOSS</small>' : ''}</h2>
    <div class="tiny c">${z.name} · stay within ±${tolFor(z)}¢ · a missed note costs ${z.atk + (q.boss ? 4 : 0)} HP</div>
    <div class="spell">${notes.map((n, i) => `<span id="chip${i}" style="--nc:${col(n.midi, 64)};--i:${i}">${lab(n.midi)}</span>`).join('')}</div>
    <div class="row"><button class="btn" data-a="hear">🔊 Hear spell</button><button class="btn primary" data-a="fight">⚔️ Fight!</button></div>
    <button class="link" data-a="close">Back</button>`);
}
function hearSpell() {
  const z = ZONES[cur.zi], notes = buildNotes(z, z.quests[cur.qi]), c = actx(); let t = c.currentTime + 0.05;
  notes.forEach((n, i) => { tone(n.midi, t, 0.6); setTimeout(() => { document.querySelectorAll('.spell span').forEach(s => s.classList.remove('hl')); const e = $('#chip' + i); if (e) e.classList.add('hl'); }, (t - c.currentTime) * 1000); t += 0.68; });
}
let pend = null;
function chestSheet(it, gold, tea) { pend = {it, gold, tea}; openSheet(`<h2 class="res-t">A chest!</h2><button class="chest" data-a="pop" aria-label="Open chest">🎁</button><div class="tiny c">Tap it to open</div>`, true); }
function findItem(id) { for (const s in S.gear) if (S.gear[s] && S.gear[s].id === id) return {it: S.gear[s], eq: true}; const it = S.bag.find(x => x.id === id); return it ? {it, eq: false} : null; }

/* ================= actions ================= */
const A = {
  tab: d => { tab = d.t; wantScroll = true; window.scrollTo(0, 0); show(); },
  voice: d => { S.voice = d.v; save(); if (!S.seen) renderIntro(); else show(); try { tone(root(), actx().currentTime + 0.02, 0.8); } catch (e) {} },
  mic: async () => { if (await enableMic()) toast('🎤 Microphone on. Echo is listening.'); show(); },
  demoMode: () => { input = 'demo'; toast('👆 Touch mode: touch and drag the play field to sing.'); show(); },
  octave: () => { S.anyOctave = !S.anyOctave; save(); show(); },
  tgl: d => { S[d.k] = !S[d.k]; save(); show(); },
  introMic: async () => { await enableMic(); S.seen = true; save(); $('#intro').classList.add('hidden'); show(); },
  introDemo: () => { input = 'demo'; S.seen = true; save(); $('#intro').classList.add('hidden'); show(); toast('👆 Touch mode: touch and drag the play field to sing.'); },
  quest: d => openPrep(+d.z, +d.q),
  hear: hearSpell, close: closeSheet,
  fight: () => launch(Battle(cur.zi, cur.qi)),
  retry: () => openPrep(cur.zi, cur.qi),
  next: () => { const n = nextOf(cur.zi, cur.qi); if (n) openPrep(n.zi, n.qi); },
  home: () => { closeSheet(); tab = 'map'; wantScroll = true; show(); },
  done: () => { closeSheet(); show(); },
  play: d => launch(MAKE[d.g]()),
  again: () => { if (G && G.replay) G.replay(); },
  ref: () => { try { tone(root(), actx().currentTime + 0.02, 1.5); } catch (e) {} },
  tea: () => { if (!G || G.hero == null || S.tea < 1 || G.end) return; if (G.hero >= G.heroMax) return; S.tea--; G.hero = Math.min(G.heroMax, G.hero + 40); save(); sfx('equip'); say('+40 HP', W * 0.3, H - 86, '#3be0a1', 22); G.teaBtn(); },
  pause: () => { if (!G) return; if (G.free) { closeStage(); show(); return; } G.paused = true; openSheet(`<h2 class="res-t" style="margin-bottom:14px">Paused</h2><div class="row"><button class="btn bad" data-a="flee">Leave</button><button class="btn primary" data-a="resume">Keep going</button></div>`, true); },
  resume: () => { closeSheet(); if (G) { G.paused = false; lastTs = performance.now(); } },
  flee: () => { closeSheet(); closeStage(); show(); },
  stat: d => { if (S.sp < 1) return; S.sp--; S.stats[d.k]++; save(); sfx('equip'); show(); },
  item: d => { const f = findItem(+d.id); if (!f) return; const cmp = !f.eq && S.gear[f.it.slot];
    openSheet(itemHTML(f.it, f.eq ? 'Equipped' : '') + (cmp ? `<div class="tiny">Currently wearing:</div>${itemHTML(cmp)}` : '') + `<div class="row">${f.eq ? `<button class="btn" data-a="unequip" data-id="${f.it.id}">Take off</button>` : `<button class="btn bad" data-a="sell" data-id="${f.it.id}">Sell 🪙 ${RAR[f.it.rar].sell}</button><button class="btn primary" data-a="equip" data-id="${f.it.id}">Equip</button>`}</div><button class="link" data-a="close">Back</button>`); },
  equip: d => { const f = findItem(+d.id); if (!f || f.eq) return; const old = S.gear[f.it.slot]; S.bag = S.bag.filter(x => x.id !== f.it.id); if (old) S.bag.push(old); S.gear[f.it.slot] = f.it; save(); sfx('equip'); closeSheet(); show(); toast(f.it.e + ' ' + f.it.name + ' equipped'); },
  unequip: d => { const f = findItem(+d.id); if (!f || !f.eq) return; if (S.bag.length >= 24) { toast('Your bag is full'); return; } S.gear[f.it.slot] = null; S.bag.push(f.it); save(); closeSheet(); show(); },
  sell: d => { const f = findItem(+d.id); if (!f || f.eq) return; S.bag = S.bag.filter(x => x.id !== f.it.id); S.gold += RAR[f.it.rar].sell; save(); sfx('coin'); closeSheet(); show(); },
  claim: d => { ensureDaily(); const q = S.daily.q[+d.i]; if (!q || q.done || q.p < DQ[q.k][1]) return; q.done = true; const rw = grant(30, 40); save(); sfx('coin'); toast(`Quest done! +${rw.xp} XP · 🪙 +${rw.gold}`); if (rw.ups) { setTimeout(() => { sfx('lvl'); confetti(60); toast('⬆ Level ' + S.lvl + '! +1 skill point'); }, 700); } show(); },
  dailyChest: () => { ensureDaily(); if (S.daily.chest) return; S.daily.chest = true; const gold = 30 + Math.floor(R() * 40), tea = R() < 0.3 && S.tea < 5 ? 1 : 0; S.gold += gold; S.tea += tea; const it = addItem(mkItem(0.05)); save(); chestSheet(it, gold, tea); show(); },
  buyChest: () => { if (S.gold < 120) return; S.gold -= 120; const it = addItem(mkItem(0.12)); save(); chestSheet(it, 0, 0); show(); },
  buyTea: () => { if (S.gold < 40 || S.tea >= 5) return; S.gold -= 40; S.tea++; save(); sfx('coin'); show(); },
  pop: () => { if (!pend) return; const p = pend; pend = null; sfx('chest', p.it.rar); if (p.it.rar >= 2) confetti(70);
    openSheet(`<div class="res-ico win">✨</div><h2 class="res-t" style="color:${RAR[p.it.rar].c}">${RAR[p.it.rar].n}!</h2>${itemHTML(p.it)}${p.gold || p.tea ? `<div class="rewards">${p.gold ? `<span class="rw gold">🪙 +${p.gold}</span>` : ''}${p.tea ? '<span class="rw">🍯 +1</span>' : ''}</div>` : ''}<div class="row"><button class="btn primary" data-a="done">Nice!</button></div>`, true); },
  reset: e => { if (e.arm) { try { localStorage.removeItem(KEY); localStorage.removeItem('vocalquest.v1'); } catch (x) {} location.reload(); } else { e.el.textContent = 'Tap again to erase everything'; e.el.dataset.arm = 1; } }
};
const QUIET = {pause: 1, resume: 1, tea: 1, again: 1, ref: 1, hear: 1, voice: 1, pop: 1, stat: 1, equip: 1, sell: 1, claim: 1, buyTea: 1};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return; const a = el.dataset.a, fn = A[a]; if (!fn) return;
  if (!QUIET[a] && !G) sfx('tap');
  if (a === 'reset') fn({el, arm: el.dataset.arm}); else fn(el.dataset);
});
document.addEventListener('visibilitychange', () => { if (document.hidden && G && !G.paused && !G.free) A.pause(); });

/* ================= boot ================= */
sizeBg(); ensureDaily(); show(); if (!S.seen) renderIntro();
requestAnimationFrame(ambient);
window.__vq = {S: () => S, G: () => G, demo, setInput: v => { input = v; }};
})();
</script>
